<body>

<div id="header">
    <h1>Playlists</h1>
</div>

<div id="navbar">
    <ul>
        <li><a href="homepage.html">Home</a></li>
        <li><a href="discover.html">Discover Music</a></li>

<div id="container">
    <div id="left">

        <div id="input-title">
            <h2>Song Title</h2>
            <input id="input-titles" type="text">
        </div>
    
        <div id="input-artist">
            <h2>Artist Name</h2>
            <input id="input-artists" type="text">
        </div>
    
        <div id="input-genre">
            <h2>Genre</h2>
            <input id="input-genres" type="text">
        </div>

            <h2>Release Year</h2>
            <input id="input-releaseyears" type="text">
        </div>
    
        <button id="submit-post-request">Submit</button>

    </div>

    <div id="right">
        <h1>Saved Songs</h1>
        <button id="submit-get-request">Submit</button>
